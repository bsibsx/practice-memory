# Activate with: --spring.profiles.active=email
# No credentials should be committed to source control.

# Practice sender identity
practice.email.from=${PRACTICE_EMAIL_FROM}

# SMTP: outbound email
spring.mail.host=${PRACTICE_MAIL_HOST}
spring.mail.port=${PRACTICE_MAIL_PORT:587}
spring.mail.username=${PRACTICE_MAIL_USERNAME}
spring.mail.password=${PRACTICE_MAIL_PASSWORD}
spring.mail.properties[mail.smtp.auth]=${PRACTICE_MAIL_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${PRACTICE_MAIL_STARTTLS:true}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# IMAP: inbound email polling
practice.email.inbound.enabled=${PRACTICE_EMAIL_INBOUND_ENABLED:false}
practice.email.imap.host=${PRACTICE_IMAP_HOST:}
practice.email.imap.port=${PRACTICE_IMAP_PORT:993}
practice.email.imap.username=${PRACTICE_IMAP_USERNAME:}
practice.email.imap.password=${PRACTICE_IMAP_PASSWORD:}
practice.email.imap.folder=${PRACTICE_IMAP_FOLDER:INBOX}
practice.email.imap.poll-ms=${PRACTICE_IMAP_POLL_MS:60000}
practice.email.imap.initial-delay-ms=${PRACTICE_IMAP_INITIAL_DELAY_MS:5000}
practice.email.imap.scan-limit=${PRACTICE_IMAP_SCAN_LIMIT:100}
